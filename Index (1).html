<title>XL Traders ERP</title>
<script>
  window.__cdnErrors = [];
  function __cdnFail(name){ window.__cdnErrors.push(name); console.error('[BOOT] CDN failed to load: ' + name); }
</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" onerror="__cdnFail('React')"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" onerror="__cdnFail('ReactDOM')"></script>
<script src="https://cdn.tailwindcss.com" onerror="__cdnFail('Tailwind CSS')"></script>
<script>
  /* ---- BOOT WATCHDOG ----
     If the app hasn't painted anything into #root within 4s, or an uncaught
     JS error fires before then, show a visible diagnostic panel instead of
     a silent blank page. This is a defensive-engineering pattern: a
     production app should always fail loudly, never fail silently. */
  function __showBootError(msg) {
    var root = document.getElementById('root');
    if (!root || root.hasChildNodes()) return; // React already mounted successfully, don't override it
    root.innerHTML =
      '<div style="max-width:560px;margin:60px auto;padding:28px;border:1px solid #fecaca;' +
      'background:#fef2f2;border-radius:16px;font-family:system-ui,-apple-system,sans-serif;color:#7f1d1d">' +
      '<div style="font-size:22px;font-weight:800;margin-bottom:10px">⚠️ App failed to start</div>' +
      '<div style="font-size:13px;line-height:1.7">' + msg + '</div>' +
      '<div style="font-size:12px;margin-top:14px;padding-top:12px;border-top:1px solid #fecaca;color:#991b1b">' +
      'Open DevTools (F12) → Console tab for the full technical error, or share a screenshot of it for help.' +
      '</div></div>';
  }
  window.addEventListener('error', function (e) {
    __showBootError('A script error stopped the app from starting:<br><code style="background:#fff;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:6px">' +
      (e.message || 'Unknown error') + '</code>' +
      (e.filename ? '<br><span style="font-size:11px;opacity:.7">at ' + e.filename + ':' + e.lineno + '</span>' : ''));
  });
  setTimeout(function () {
    var reasons = [];
    if (window.__cdnErrors.length) reasons.push('These resources failed to load: <b>' + window.__cdnErrors.join(', ') + '</b> — usually a network block, firewall, or ad-blocker.');
    if (typeof React === 'undefined') reasons.push('React library did not load.');
    if (!reasons.length) reasons.push('No specific cause detected — check the Console tab (F12) for a red error message.');
    __showBootError(reasons.join('<br><br>'));
  }, 4500);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter','system-ui','sans-serif'], mono: ['JetBrains Mono','monospace'] }
    }
  }
}
</script>
<style>
  /* XL Traders ERP runs in ONE fixed dark theme (not a toggle) — staff stare at this
     screen for hours, often in a dim shop; zinc-950/zinc-100 (not pure black/white)
     avoids the halation that pure #000/#fff causes over long viewing sessions. */
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; background:#09090b; color:#f4f4f5; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#3f3f46; border-radius:8px; }
  /* Safety net: any raw <input>/<select> that forgets to set its own bg/text
     classes still reads correctly on the dark app background, instead of
     silently rendering as a white-on-white browser default. */
  input, select, textarea { font-family: inherit; background-color:#27272a; color:#f4f4f5; }
  input:focus, select:focus, textarea:focus { outline:none; }
  input[type=checkbox], input[type=radio] { accent-color:#dc2626; }
  input::placeholder, textarea::placeholder { color:#71717a; }
  .num { font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  @keyframes slideUp { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
  .anim-in { animation: slideUp .18s ease-out; }
  /* Print: hide app, show only print area */
  #print-area { display:none; }
  @media print {
    body * { visibility:hidden; }
    #print-area, #print-area * { visibility:visible; }
    #print-area { display:block; position:absolute; left:0; top:0; width:100%; }
    @page { margin: 10mm; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="print-area"></div>

<script src="https://cdn.jsdelivr.net/gh/nileshkchaubey-glitch/xl_traders_crm@main/app.js" onerror="__cdnFail('App bundle (app.js from jsDelivr)')"></script>
</body>
